name: CI

on:
  push:
    branches:
      - master
      - "sw-*"
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: samewise
          POSTGRES_PASSWORD: samewise_ci
          POSTGRES_DB: samewise_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U samewise -d samewise_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install pnpm
        run: npm install --global pnpm@11.19.0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: "services/matcher/uv.lock"

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync Python dependencies
        run: uv sync --project services/matcher --locked

      - name: Run repository verification
        env:
          SAMEWISE_TEST_DATABASE_URL: postgres://samewise:samewise_ci@localhost:5432/samewise_test
        run: pnpm verify

      - name: Benchmark SW-022 held-out identity assignments
        run: pnpm benchmark:sw022

      - name: Evaluate SW-024 independent collision truth scenarios
        run: pnpm benchmark:sw024

      - name: Evaluate SW-025 new actual matcher fixtures
        run: pnpm benchmark:sw025

      - name: Build production web app
        run: pnpm --filter @samewise/web build
