name: CI

on:
  push:
    branches:
      - master
      - "sw-*"
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: samewise
          POSTGRES_PASSWORD: samewise_ci
          POSTGRES_DB: samewise_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U samewise -d samewise_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install pnpm
        run: npm install --global pnpm@11.19.0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: "services/matcher/uv.lock"

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync Python dependencies
        run: uv sync --project services/matcher --locked

      - name: Run repository verification
        env:
          SAMEWISE_TEST_DATABASE_URL: postgres://samewise:samewise_ci@localhost:5432/samewise_test
        run: pnpm verify

      - name: Benchmark SW-022 held-out identity assignments
        run: pnpm benchmark:sw022

      - name: Evaluate SW-024 independent collision truth scenarios
        run: pnpm benchmark:sw024

      - name: Evaluate SW-025 new actual matcher fixtures
        run: pnpm benchmark:sw025

      - name: Diagnose SW-026 duplicate-heavy matcher review demand
        run: pnpm benchmark:sw026

      - name: Build production web app
        run: pnpm --filter @samewise/web build

      - name: Install isolated Playwright browser for public sample
        if: github.event_name == 'pull_request'
        run: |
          npm install --prefix "$RUNNER_TEMP/samewise-playwright" --no-save playwright@1.56.1
          "$RUNNER_TEMP/samewise-playwright/node_modules/.bin/playwright" install --with-deps chromium

      - name: Verify synthetic public sample in browser
        if: github.event_name == 'pull_request'
        env:
          SAMEWISE_PYTHON: ${{ github.workspace }}/services/matcher/.venv/bin/python
          SAMEWISE_RUNTIME_NODE_MODULES: ${{ runner.temp }}/samewise-playwright/node_modules
          NODE_OPTIONS: --dns-result-order=ipv4first
        run: |
          pnpm --filter @samewise/api start > "$RUNNER_TEMP/samewise-api.log" 2>&1 &
          api_pid=$!
          pnpm --filter @samewise/web dev --host 127.0.0.1 > "$RUNNER_TEMP/samewise-web.log" 2>&1 &
          web_pid=$!
          trap 'result=$?; if [ "$result" -ne 0 ]; then tail -100 "$RUNNER_TEMP/samewise-api.log"; tail -100 "$RUNNER_TEMP/samewise-web.log"; fi; kill "$api_pid" "$web_pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health > /dev/null &&
               curl --fail --silent http://127.0.0.1:5173/ > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3000/api/health > /dev/null
          curl --fail --silent http://127.0.0.1:5173/ > /dev/null
          pnpm acceptance:public-demo
          node apps/web/e2e/export-verifier-smoke.mjs
